<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDb Sentiment Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>IMDb Sentiment Analyzer</h1>

        <p class="subtitle">
            Enter a movie review and let the model predict its sentiment.
        </p>

        <textarea
            id="review"
            placeholder="Write your movie review here..."
        ></textarea>

        <button id="predictBtn">Analyze Sentiment</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
